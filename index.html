<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wetter App</title>
  <link rel="stylesheet" href="style.css">
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>
   <main class="main-container">
    <header class="input-container">
      <input class="city-input " placeholder="city suchen" type="text" name="" id="">
      <button class="search-btn">
        <span class="material-symbols-outlined">
          search
        </span>
      </button>
    </header>
    <section class="wetter-info">
      <div class="location-date-container">
        <div class="location">
          <span class="material-symbols-outlined">
              location_on
          </span>
          <h4 class="land-txt">Gaza</h4>
        </div>
        <h5 class="current-date-txt reglur-text">Web, 07 Aug</h5>
      </div>
      <div class="wetter-sommer-container">
        <img src="assets/weather/clouds.svg" alt="" class="wetter-summer-img">
        <div class="wetter-summer-info">
          <h1 class="temp-txt">℃</h1>
          <h3 class="condition-txt reglur-text">clouds</h3>
        </div>
      </div>
      <div class="wetter-conditions-container">
        <div class="condition-item">
              <span class="material-symbols-outlined">
                  water_drop
              </span>
              <div class="condition-info">
                <h5 class="reglur-text">Humidity</h5>
                <h5 class="humidity-value-txt">55%</h5>
              </div>
              
        </div>
        <div class="condition-item">
              <span class="material-symbols-outlined">
                 air
              </span>
              <div class="condition-info">
                <h5 class="reglur-text">wind speed</h5>
                <h5 class="wind-value-txt">2 M/s</h5>
              </div>
              
        </div>
        
      </div>
      <div class="forecast-item-container">
        <div class="forecast-item">
          <h5 class="forecast-item-date reglur-text">05 Aug</h5>
          <img src="assets/weather/thunderstorm.svg" alt="" class="forecast-item-img">
          <h5 class="forecast-item-temp">29 ℃ </h5>

        </div>
        <div class="forecast-item">
          <h5 class="forecast-item-date reglur-text">05 Aug</h5>
          <img src="assets/weather/thunderstorm.svg" alt="" class="forecast-item-img">
          <h5 class="forecast-item-temp">29 ℃ </h5>
          
        </div>
        <div class="forecast-item">
          <h5 class="forecast-item-date reglur-text">05 Aug</h5>
          <img src="assets/weather/thunderstorm.svg" alt="" class="forecast-item-img">
          <h5 class="forecast-item-temp">29 ℃ </h5>
          
        </div>
        <div class="forecast-item">
          <h5 class="forecast-item-date reglur-text">05 Aug</h5>
          <img src="assets/weather/thunderstorm.svg" alt="" class="forecast-item-img">
          <h5 class="forecast-item-temp">29 ℃ </h5>
          
        </div>
      </div>
    </section>
    <section class="search-city section-message">
      
     <img  src="assets/message/search-city.png" alt="">

      <div>
        <h1 >Suchen city</h1>
        <h4 class="reglur-text">
          Find Out the weather contitions od city
        </h4>
      </div>
    </section>
    <section class="not-found-city section-message" style="display: none;">
      
     <img class="" src="assets/message/not-found.png" alt="">

      <div>
        <h1 >Suchen city</h1>
        <h4 class="reglur-text">
          Find Out the weather contitions od city
        </h4>
      </div>
    </section>
    

   </main>
</body>
<script src="script.js"></script>
</html>
